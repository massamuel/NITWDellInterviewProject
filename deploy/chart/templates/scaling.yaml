apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: api
spec:
  scaleTargetRef:
    name: api
  minReplicaCount: {{ .Values.scaling.minReplicas }}
  maxReplicaCount: {{ .Values.scaling.maxReplicas }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies: [{type: Percent, value: 25, periodSeconds: 60}]
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - {type: Percent, value: 100, periodSeconds: 30}
            - {type: Pods, value: 4, periodSeconds: 30}
          selectPolicy: Max
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: {{ .Values.scaling.cpuUtilization | quote }}
    {{- if .Values.scaling.schedule.enabled }}
    - type: cron
      metadata:
        timezone: {{ .Values.scaling.schedule.timezone | quote }}
        start: {{ .Values.scaling.schedule.start | quote }}
        end: {{ .Values.scaling.schedule.end | quote }}
        desiredReplicas: {{ .Values.scaling.schedule.replicas | quote }}
    {{- end }}
