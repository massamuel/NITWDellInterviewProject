name: Docker Training Image CI

on:
  push:
    branches: [main, repo-reorg]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build training image with the organized model and raw dataset
        run: docker build --target trainer -t nitwdell-trainer:ci .
