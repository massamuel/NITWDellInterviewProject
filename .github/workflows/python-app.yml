name: Historical model experiments

# Kept as an explicit manual workflow; the application checks run in ci.yaml.
on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate historical scripts without training or writing to the repository
        run: python -m compileall -q models/legacy scripts/preprocess.py
